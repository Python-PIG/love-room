<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deployFlowTitle deployFlowDesc">
  <title id="deployFlowTitle">Love Room deployment flow</title>
  <desc id="deployFlowDesc">Deployment flow from git clone to env file, Docker Compose or Node.js, then browser setup and persistent SQLite and uploads.</desc>
  <rect width="1200" height="420" rx="30" fill="#F7FAF7"/>
  <rect x="32" y="32" width="1136" height="356" rx="26" fill="#FFFFFF" stroke="#D5E2D5"/>
  <text x="74" y="92" fill="#2F3D34" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700">One-command deploy path</text>
  <text x="76" y="126" fill="#667367" font-family="Arial, sans-serif" font-size="18">Configure server secrets once, then finish the personal room setup in the browser.</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <g transform="translate(76 184)">
      <rect width="180" height="86" rx="18" fill="#F9F4EC" stroke="#E4D5C4"/>
      <text x="28" y="37" fill="#3B3028" font-weight="700">git clone</text>
      <text x="28" y="62" fill="#7B6A5E" font-size="14">Get the template</text>
    </g>
    <path d="M270 227H340" stroke="#A7B7A6" stroke-width="4" stroke-linecap="round"/>
    <path d="M332 216L346 227L332 238" stroke="#A7B7A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(360 184)">
      <rect width="190" height="86" rx="18" fill="#F9F4EC" stroke="#E4D5C4"/>
      <text x="28" y="37" fill="#3B3028" font-weight="700">edit .env</text>
      <text x="28" y="62" fill="#7B6A5E" font-size="14">ROOM_SECRET + path</text>
    </g>
    <path d="M564 227H634" stroke="#A7B7A6" stroke-width="4" stroke-linecap="round"/>
    <path d="M626 216L640 227L626 238" stroke="#A7B7A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(654 156)">
      <rect width="216" height="142" rx="20" fill="#EEF7EF" stroke="#C8DCC8"/>
      <text x="28" y="42" fill="#2F3D34" font-weight="700">docker compose</text>
      <text x="28" y="70" fill="#667367" font-size="14">up -d --build</text>
      <line x1="28" y1="91" x2="188" y2="91" stroke="#D5E2D5"/>
      <text x="28" y="118" fill="#2F3D34" font-weight="700">or Node.js</text>
    </g>
    <path d="M886 227H956" stroke="#A7B7A6" stroke-width="4" stroke-linecap="round"/>
    <path d="M948 216L962 227L948 238" stroke="#A7B7A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(976 184)">
      <rect width="150" height="86" rx="18" fill="#3B3028"/>
      <text x="25" y="37" fill="#FFF8EF" font-weight="700">Browser setup</text>
      <text x="25" y="62" fill="#D8CBBB" font-size="14">Names + cities</text>
    </g>
  </g>
  <text x="76" y="342" fill="#667367" font-family="Arial, sans-serif" font-size="16">Persistent data: SQLite in data/app.sqlite and uploads in uploads/ or Docker volumes.</text>
</svg>
