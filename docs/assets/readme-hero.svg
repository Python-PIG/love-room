    <text x="24" y="86" fill="#3B3028" font-family="Georgia, serif" font-size="38" font-weight="700">21:36</text>
    <text x="24" y="122" fill="#7C6B5E" font-family="Arial, sans-serif" font-size="18">Cloudy · 22°C</text>
    <text x="250" y="90" font-size="54">☁️</text>
  </g>

  <g transform="translate(442 208)">
    <rect width="330" height="172" rx="18" fill="#F5FAF6" stroke="#D8E5D8"/>
    <text x="24" y="42" fill="#5A7A65" font-family="Arial, sans-serif" font-size="13" font-weight="700">CITY B</text>
    <text x="24" y="86" fill="#3B3028" font-family="Georgia, serif" font-size="38" font-weight="700">14:36</text>
    <text x="24" y="122" fill="#7C6B5E" font-family="Arial, sans-serif" font-size="18">Sunny · 18°C</text>
    <text x="250" y="90" font-size="54">☀️</text>
  </g>

  <g transform="translate(802 184)">
