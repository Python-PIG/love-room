    <text x="22" y="38" fill="#3B3028" font-family="Arial, sans-serif" font-size="20" font-weight="700">Daily Question</text>
    <text x="22" y="72" fill="#7C6B5E" font-family="Arial, sans-serif" font-size="15">Answer privately, unlock together.</text>
  </g>
  <g transform="translate(338 422)">
