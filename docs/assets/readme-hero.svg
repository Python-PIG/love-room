    <text x="28" y="104" fill="#FFF8EF" font-family="Georgia, serif" font-size="44" font-weight="700">42 days</text>
    <text x="30" y="144" fill="#D8CBBB" font-family="Arial, sans-serif" font-size="18">06 hours · 18 min</text>
    <rect x="28" y="166" width="230" height="12" rx="6" fill="#5D5046"/>
    <rect x="28" y="166" width="142" height="12" rx="6" fill="#F0A48A"/>
  </g>

  <g transform="translate(82 422)">
